name: Gallery Index Rebuild

on:
  push:
    branches:
      - codex/rebuild-gallery-index

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            gallery
            scripts
            tests
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest Pillow
      - name: Verify rebuild semantics
        run: python -m pytest tests/test_rebuild_gallery_index.py -q
      - name: Rebuild perceptual index
        run: python scripts/rebuild_gallery_index.py
      - name: Preserve rebuilt manifest
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-gallery-index
          path: gallery/gallery_index.json
          if-no-files-found: error
      - name: Verify complete rebuilt index
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests -vv 2>&1 | tee integrity-report.txt
      - name: Preserve integrity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-integrity-diagnostics
          path: |
            integrity-report.txt
            gallery/gallery_index.json
          if-no-files-found: error
      - name: Fail if integrity verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
      - name: Summarize rebuilt manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('gallery/gallery_index.json').read_text(encoding='utf-8'))
          files = data.get('files') or {}
          categories = {path.split('/')[1] for path in files if path.startswith('gallery/') and path.count('/') == 2}
          print(f"verified manifest: {len(categories)} categories, {len(files)} images, max_index={data.get('max_index')}")
          PY
          sha256sum gallery/gallery_index.json
      - name: Commit rebuilt manifest
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery/gallery_index.json
          if git diff --cached --quiet; then
            echo 'No manifest changes generated; refusing an unverifiable rebuild.'
            exit 1
          fi
          git commit -m 'fix: rebuild complete Gallery perceptual index'
          git push origin HEAD:codex/rebuild-gallery-index