name: Gallery Index Rebuild

on:
  push:
    branches:
      - codex/rebuild-gallery-index

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            gallery/gallery_index.json
            scripts
            tests
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest Pillow
      - run: python -m pytest tests -q
